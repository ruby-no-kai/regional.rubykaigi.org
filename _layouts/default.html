<!doctype html>
<html lang="ja">
<head>
  {% assign og_image_version = site.data.og_image.digest | default: 'latest' %}
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Style-Type" content="text/css">
  <link rel="icon" href="/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&amp;family=M+PLUS+1:wght@400;500;700;800&amp;family=Noto+Serif+JP:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <link href="/stylesheets/regional.css" media="screen" rel="stylesheet">
  <link rel="canonical" href="{{ page.url | replace: 'index.html', '' | prepend: 'https://regional.rubykaigi.org' }}">
  <meta property="og:title" content="Regional RubyKaigi">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ page.url | replace: 'index.html', '' | prepend: 'https://regional.rubykaigi.org' }}">
  <meta property="og:image" content="https://regional.rubykaigi.org/images/og/regional-rubykaigi.png?v={{ og_image_version }}">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Regional RubyKaigiの開催情報">
  <meta property="og:description" content="日本各地で開催される地域Ruby会議の開催情報とアーカイブ">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Regional RubyKaigi">
  <meta name="twitter:description" content="日本各地で開催される地域Ruby会議の開催情報とアーカイブ">
  <meta name="twitter:image" content="https://regional.rubykaigi.org/images/og/regional-rubykaigi.png?v={{ og_image_version }}">
  <meta name="twitter:image:alt" content="Regional RubyKaigiの開催情報">
  <title>Regional RubyKaigi</title>
</head>
<body{% if page.body_class %} class="{{ page.body_class }}"{% endif %}>
  {{ content }}
</body>
</html>
