name: Continuous Integration

on:
  pull_request:
  push:
    branches:
      - gh-pages

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The test suite builds the site (see test/index_rss_rendering_test.rb),
          # and index.rss's added_on comes from git history (see GitAddedOn) —
          # the default shallow checkout wouldn't have it.
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Run all tests
        run: bundle exec ruby -Itest -e 'Dir["test/**/*_test.rb"].sort.each { |file| require_relative file }'
      - name: Validate event data
        run: ruby script/validate_kaigis.rb
      - name: Build site
        run: bundle exec jekyll build
