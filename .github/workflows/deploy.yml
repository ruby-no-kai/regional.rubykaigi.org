name: Deploy to GitHub Pages

on:
  push:
    branches:
      - gh-pages
    paths-ignore:
      - ".github/**"
      - "AGENTS.md"
      - "CONTRIBUTING.md"
      - "Gemfile"
      - "Gemfile.lock"
      - "LICENSE"
      - "README.md"
      - "script/**"
      - "test/**"
  workflow_dispatch:
  schedule:
    - cron: "7 15 * * *" # 00:07 JST

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Install OGP image dependencies
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin
      - name: Generate OGP image
        run: ruby script/generate_og_image.rb
      - name: Build with Jekyll
        run: bundle exec jekyll build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
